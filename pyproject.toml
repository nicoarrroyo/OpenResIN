[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openresin"
version = "2.0"
dependencies = [
	"numpy",
	"matplotlib",
	"Pillow",
	"omnicloudmask",
	"geopandas",
	"fiona",
	"rasterio",
	"shapely",
	"scikit-learn"
]
requires-python = ">=3.11"

description = "Open-source Reservoir Identification and Navigation tool"
readme = "README.md"
license = "Apache-2.0"
authors = [
	{name = "Nicolas Renato Arroyo", email = "nicolas.renato.arroyo@gmail.com"}
]

[project.scripts]
openresin-label-sw	= "openresin.label_sw:main"
openresin-train-sw	= "openresin.train_sw:main"

[dependency-groups]
dev = [
	"pytest"
]

[project.urls]
Repository = "https://github.com/nicoarrroyo/OpenResIN.git"
